        routing: auto_verified
        in_scope: true
        notes: >
          Address pre-populated from People Portal. OQ-14 open: lock vs allow edit.
          Address-not-found warning pattern present.
      - name: "Service Letter"
        routing: auto_verified
        in_scope: true
        notes: "Purpose dropdown options TBD (OQ-05)."
      - name: "Visa Processing Letter"
        routing: manual_dv_edv
        in_scope: true
        notes: >
          DV/EDV specialist verifies and manually sends. Comments field required
          (max 300 chars, one line). OQ-11 open: DOCS dev required for text field.
      - name: "Letter of Recommendation (LOR)"
        routing: manual_dv_edv
        in_scope: true
        notes: >
          DV/EDV specialist verifies and manually sends. Notes/Responsibilities
          multi-line field (max ~1000 chars). OQ-11 open: DOCS dev required.
          Ex-employee LOR: out of scope (Phase 3).
      - name: "Relocation Letter"
        routing: tbd
        in_scope: false
        notes: "Removed from Phase 1 by D-16. Moved to Phase 4+ investigation."
